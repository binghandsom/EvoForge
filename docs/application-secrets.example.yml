# Copy this file to ~/.evoforge/application-secrets.yml on the machine that
# runs EvoForge. Keep the real file outside the Git repository.
#
# Spring Boot loads it through:
#   spring.config.import=optional:file:${user.home}/.evoforge/application-secrets.yml
#
# Values in this file override backend/src/main/resources/application.yml.

spring:
  rabbitmq:
    host: rabbitmq.example.com
    port: 5672
    username: pc-agent-user
    password: change-me
    virtual-host: /
    ssl:
      enabled: false

evoforge:
  database:
    url: jdbc:postgresql://localhost:5432/evoforge
    username: postgres
    password: change-me
  skills:
    # Latest skill code cache. The database remains authoritative and stores a
    # fallback copy; this local path is the reload hot path.
    codeStoragePath: /Users/you/.evoforge/skill-code-cache
  deviceAgent:
    enabled: true
    userId: local-user
    deviceId: local-pc
    # Keep at least 2 so a long-running task waiting for human_response does not
    # block the command listener from receiving that response.
    concurrentConsumers: 2
    commandSigningSecret: change-me-command-hmac
    eventSigningSecret: change-me-event-hmac
  codexTask:
    enabled: false
    # Default project key used when a codex_task does not include attributes.projectKey.
    defaultWorkspace: evoforge
    # Optional project whitelist. Mobile commands can select one of these with
    # attributes.projectKey, but cannot send arbitrary filesystem paths.
    workspaces:
      evoforge: /Users/you/Documents/project/binghandsom/EvoForge
      mobile-app: /Users/you/Documents/project/mobile-app
    # Base URL printed into Codex Bridge instructions. Keep it reachable from the
    # local Codex process that executes codex_task commands.
    bridgeBaseUrl: http://localhost:18080
    # How long Codex Bridge waits for a mobile human_response after
    # /api/codex/bridge/questions/ask publishes a needs_input event.
    questionTimeoutSeconds: 1800
  tester:
    enabled: true
    autoRepairEnabled: false
    autoDiscoverEnabled: true
    # Set true if you want the default LLM to refine discovered tester records.
    # The final runnable commands are persisted as tester capabilities. EvoForge
    # no longer uses an executable allowlist; it checks project workspace
    # boundaries when capabilities are saved or run.
    modelDiscoveryEnabled: false
    autoOptimizeEnabled: true
